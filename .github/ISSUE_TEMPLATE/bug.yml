name: Bug 反馈
description: 崩溃、功能异常、聊天失败、更新失败等
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认已经安装 [Releases 最新桌面版](https://github.com/hyqibot/DeepSeek-Harness-Token-Free/releases/latest)。

        **免 Token（Zero-Token）必须用安装包**。从源码 `yarn dev` 只能配官方 API Key，网页免 Token 不可用。

        截图和日志里请打码 API Key、Cookie、激活码。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已安装 GitHub Releases 里的最新桌面版，并在该版本上复现
          required: true
        - label: 已搜索过 [现有 Issues](https://github.com/hyqibot/DeepSeek-Harness-Token-Free/issues)，没有重复
          required: true
        - label: 已隐藏截图 / 日志中的密钥和 Cookie
          required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 10
        - Windows 11
        - macOS Apple Silicon（M 系列）
        - macOS Intel
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 桌面端版本
      placeholder: 例如 2.0.0（设置 / 关于，或安装包文件名）
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: 安装来源
      options:
        - GitHub Releases 安装包
        - 源码 yarn dev
        - 其他
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 实际发生了什么
      description: 用 1–3 句话说明现象。你原本期望怎样。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 写到别人能照做。偶发请写大概频率。
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 错误信息与日志
      description: 弹窗、终端、Recent server logs 请整段粘贴。
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: 截图 / 录屏 / 补充
      description: 最近是否升级过、换过模型、改过设置。macOS 若被拦截，请说明是否已右键打开。
